  <path d="M0 365 220 325 390 355 560 285 730 360 900 315 1080 365 1260 300 1500 350V420H0Z" fill="#163329" opacity=".55"/>
  <path d="M0 348H1500" stroke="url(#glow)" stroke-width="2"/>
